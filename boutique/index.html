<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vory V — Boutique</title>
<style>
:root{--bg:#0e1628;--panel:#121a2d;--purple:#9333ea;--pink:#ff3f68;--orange:#f97316;--text:#f8fafc;--muted:#aab4c7;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 4%,rgba(147,51,234,.15),transparent 25%),var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial}
a{text-decoration:none;color:inherit}button,input{font:inherit}.container{width:min(1380px,calc(100% - 34px));margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(10,17,32,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:950}.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.back{border:0;background:transparent;color:#cbd5e1;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:850;cursor:pointer}.tabs button.active,.tabs button:hover{background:rgba(255,255,255,.06);color:#fff}.back{border:1px solid var(--line)}
.hero{padding:58px 0 28px}.hero small{color:#c4b5fd;font-weight:950;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(42px,6vw,68px);margin:8px 0 12px}.hero p{color:var(--muted);max-width:760px;line-height:1.7}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;align-items:start;padding-bottom:80px}.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:17px}.toolbar h2{margin:0}
.search{background:#0b1222;color:#fff;border:1px solid var(--line);border-radius:999px;padding:11px 15px;outline:none}.panel{display:none}.panel.active{display:block}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;overflow:hidden}.img{height:155px;background:#0b1222;display:grid;place-items:center;color:#64748b;font-size:12px;font-weight:800}.body{padding:15px}.cat{color:#a78bfa;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.body h3{margin:6px 0}.body p{color:var(--muted);font-size:12px;min-height:35px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.price{font-size:19px;font-weight:950}.add,.primary{border:0;border-radius:10px;padding:9px 11px;background:linear-gradient(100deg,var(--purple),var(--pink));color:#fff;font-weight:900;cursor:pointer}
.cart{position:sticky;top:94px;background:#0d1322;border:1px solid var(--line);border-radius:20px;padding:18px}.carthead{display:flex;justify-content:space-between;align-items:center}.carthead h2{margin:0}.count{background:var(--orange);color:#111;min-width:30px;height:30px;border-radius:999px;display:grid;place-items:center;font-weight:950}
.items{display:grid;gap:8px;margin:15px 0;max-height:300px;overflow:auto}.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px}.item{background:#0b1222;border:1px solid var(--line);border-radius:11px;padding:10px}.itemtop{display:flex;justify-content:space-between;font-size:13px;font-weight:850}.qty{display:flex;gap:7px;align-items:center;margin-top:8px}.qty button{width:27px;height:27px;background:#171f34;border:1px solid var(--line);color:#fff;border-radius:7px;cursor:pointer}.remove{margin-left:auto}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;font-size:18px;font-weight:950}.actions{display:grid;gap:9px;margin-top:14px}.secondary{border:1px solid var(--line);border-radius:10px;padding:10px;background:#171f34;color:#fff;font-weight:900;cursor:pointer}.primary{padding:11px}.primary:disabled{opacity:.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:none;place-items:center;padding:18px}.modal.show{display:grid}.box{width:min(520px,100%);background:#111a2e;border:1px solid var(--line);border-radius:20px;padding:21px}.boxtop{display:flex;justify-content:space-between;align-items:center}.boxtop h2{margin:0}.close{border:0;background:none;color:#aaa;font-size:25px;cursor:pointer}.field{display:grid;gap:6px;margin-top:12px}.field label{font-size:12px;font-weight:850}.field input{background:#0b1222;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px}.preview{background:#0b1222;border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:13px;color:#cbd5e1;font-size:12px;line-height:1.6}.msg{font-size:12px;min-height:18px;margin-top:8px}.ok{color:#86efac}.err{color:#fca5a5}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.cart{position:static}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.products{grid-template-columns:1fr}.nav,.toolbar{align-items:flex-start;flex-direction:column}.search{width:100%}}
</style></head><body>
<header><div class="container nav"><a class="brand" href="/A-4-L/">Vory V Industry — Boutique</a><div class="tabs"><button class="tab active" data-tab="best">Meilleures ventes</button><button class="tab" data-tab="selection">Notre sélection</button><button class="tab" data-tab="packs">Les packs</button><a class="back" href="/A-4-L/">← Site principal</a></div></div></header>
<main class="container"><section class="hero"><small>Vory V Industry</small><h1>La boutique.</h1><p>Choisis tes produits, règle les quantités puis envoie ta demande directement à l'équipe Vory V.</p></section>
<div class="layout"><section><div class="toolbar"><h2 id="title">Meilleures ventes</h2><input id="search" class="search" placeholder="Rechercher..."></div>
<div class="panel active" id="best"><div class="products" id="bestProducts"></div></div>
<div class="panel" id="selection"><div class="products" id="selectionProducts"></div></div>
<div class="panel" id="packs"><div class="products" id="packProducts"></div></div></section>
<aside class="cart"><div class="carthead"><h2>Mes achats</h2><span class="count" id="count">0</span></div><div class="items" id="cart"></div><div class="total"><span>Total</span><span id="total">0 $</span></div><div class="actions"><button class="secondary" id="list">Liste de nos achats</button><button class="primary" id="order" disabled>Passer commande</button></div></aside></div></main>
<div class="modal" id="orderModal"><div class="box"><div class="boxtop"><h2>Passer commande</h2><button class="close" data-close="orderModal">×</button></div><div class="field"><label>Nom RP</label><input id="rpName" placeholder="Michel Skow"></div><div class="field"><label>Numéro RP</label><input id="rpNumber" placeholder="00-00-00-00-00"></div><div class="field"><label>Mail RP</label><input id="rpEmail" type="email" placeholder="exemple@a4l.fr"></div><div class="field"><label>Prix de la commande</label><input id="orderPrice" readonly></div><div class="preview" id="preview"></div><div class="msg" id="msg"></div><button class="primary" style="width:100%" id="send">Envoyer la demande</button></div></div>
<div class="modal" id="listModal"><div class="box"><div class="boxtop"><h2>Liste de nos achats</h2><button class="close" data-close="listModal">×</button></div><div class="items" id="listItems"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../database.js"></script>
<script>
const db=(window.vorySupabaseConfigured&&window.vorySupabaseConfigured())?window.supabase.createClient(window.VORY_SUPABASE_URL,window.VORY_SUPABASE_KEY):null;
const catalog={best:[['Optique','RCO / ARCO','Optique polyvalente.',1000],['Arme','SPAR-16','Fusil polyvalent.',5000],['Arme','R4-C','Configuration compacte.',5000],['Protection','Gilet P2','Protection individuelle.',5000]],selection:[['Arme','MK20','Plateforme bullpup légère.',5000],['Arme','TRG-21','Configuration compacte.',5000],['Munition','Chargeur 5.56','Chargeur 30 coups.',800],['Accessoire','Bipied','Accessoire de stabilisation.',1000]],packs:[['Pack','KIT R4-C','R4-C + RCO + chargeurs + Gilet P2.',12000],['Pack','KIT SPAR-16','SPAR-16 + RCO + chargeurs + Gilet P2.',12000]]};
let cart=[];const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('fr-FR')+' $',sum=()=>cart.reduce((s,i)=>s+i.price*i.quantity,0);
function card(p){return `<article class="card" data-search="${(p[0]+' '+p[1]).toLowerCase()}"><div class="img">Image ${p[1]}</div><div class="body"><div class="cat">${p[0]}</div><h3>${p[1]}</h3><p>${p[2]}</p><div class="row"><span class="price">${money(p[3])}</span><button class="add" data-name="${p[1]}" data-price="${p[3]}">Ajouter</button></div></div></article>`}
$('bestProducts').innerHTML=catalog.best.map(card).join('');$('selectionProducts').innerHTML=catalog.selection.map(card).join('');$('packProducts').innerHTML=catalog.packs.map(card).join('');
function render(){const box=$('cart');box.innerHTML=cart.length?'':'<div class="empty">Aucun achat ajouté.</div>';cart.forEach((i,n)=>box.insertAdjacentHTML('beforeend',`<div class="item"><div class="itemtop"><span>${i.name}</span><span>${money(i.price*i.quantity)}</span></div><div class="qty"><button data-a="minus" data-i="${n}">−</button><span>${i.quantity}</span><button data-a="plus" data-i="${n}">+</button><button class="remove" data-a="remove" data-i="${n}">×</button></div></div>`));$('count').textContent=cart.reduce((s,i)=>s+i.quantity,0);$('total').textContent=money(sum());$('order').disabled=!cart.length}
document.addEventListener('click',e=>{if(e.target.matches('.add')){let x=cart.find(i=>i.name===e.target.dataset.name);x?x.quantity++:cart.push({name:e.target.dataset.name,price:+e.target.dataset.price,quantity:1});render()}if(e.target.dataset.a){let n=+e.target.dataset.i,a=e.target.dataset.a;if(a==='plus')cart[n].quantity++;if(a==='minus'&&--cart[n].quantity<=0)cart.splice(n,1);if(a==='remove')cart.splice(n,1);render()}});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');$('title').textContent=b.textContent;$('search').value='';document.querySelectorAll('.card').forEach(c=>c.style.display='')});
$('search').oninput=e=>document.querySelectorAll('.panel.active .card').forEach(c=>c.style.display=c.dataset.search.includes(e.target.value.toLowerCase())?'':'none');
function show(id){$(id).classList.add('show')}function hide(id){$(id).classList.remove('show')}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));
$('list').onclick=()=>{let b=$('listItems');b.innerHTML=cart.length?'':'<div class="empty">Aucun achat.</div>';cart.forEach(i=>b.insertAdjacentHTML('beforeend',`<div class="item"><div class="itemtop"><span>${i.quantity}× ${i.name}</span><span>${money(i.price*i.quantity)}</span></div></div>`));show('listModal')};
$('order').onclick=()=>{$('orderPrice').value=money(sum());$('preview').innerHTML=cart.map(i=>`${i.quantity}× ${i.name} — ${money(i.price*i.quantity)}`).join('<br>');$('msg').textContent='';show('orderModal')};
$('send').onclick=async()=>{let name=$('rpName').value.trim(),num=$('rpNumber').value.trim(),email=$('rpEmail').value.trim();if(!name||!num||!email){$('msg').className='msg err';$('msg').textContent='Remplis toutes les informations RP.';return}if(!db){$('msg').className='msg err';$('msg').textContent='Supabase non configuré.';return}$('send').disabled=true;let {error}=await db.from('shop_orders').insert({buyer_name:name,buyer_number:num,buyer_email:email,items:cart,total:sum(),status:'pending'});$('send').disabled=false;if(error){$('msg').className='msg err';$('msg').textContent=error.message;return}$('msg').className='msg ok';$('msg').textContent='Commande envoyée ✓';cart=[];render();setTimeout(()=>hide('orderModal'),1000)};
render();
</script></body></html>
