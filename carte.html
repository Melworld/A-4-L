<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vory V — Carte interactive</title>
<style>
:root{--panel:#0f172a;--text:#f8fafc;--muted:#94a3b8;--line:rgba(255,255,255,.09);--accent:#f97316}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:#0b1020;color:var(--text);overflow:hidden}button,input,select,textarea{font:inherit}.app{height:100%;display:grid;grid-template-columns:330px 1fr}.sidebar{background:linear-gradient(180deg,#0f172a,#111827);border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:16px;z-index:10}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#fb923c,#ea580c);display:grid;place-items:center;font-size:21px}h1{font-size:18px;margin:0}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}.sidebar-add{width:100%;border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:11px 14px;font-weight:800;background:#475569;color:#cbd5e1;cursor:not-allowed;transition:.15s}.sidebar-add.allowed{background:var(--accent);color:#fff;cursor:pointer;border-color:rgba(249,115,22,.55);box-shadow:0 8px 24px rgba(249,115,22,.18)}.sidebar-add.allowed.active{background:#16a34a;border-color:#22c55e}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#64748b;margin-bottom:8px}.filters{display:flex;flex-direction:column;gap:8px}.filter{display:flex;align-items:center;justify-content:space-between;background:#0b1222;border:1px solid var(--line);padding:9px 10px;border-radius:10px;cursor:pointer;transition:.15s}.filter:hover,.filter.active{background:#172033;border-color:rgba(249,115,22,.45)}.filter-left{display:flex;align-items:center;gap:9px}.dot{width:10px;height:10px;border-radius:50%}.count{font-size:11px;color:#64748b}.list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}.list-item{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#0b1222;cursor:pointer}.list-item b{font-size:12px;display:block}.list-item span{font-size:10px;color:#64748b}.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:#64748b;font-size:12px;line-height:1.45}.sidebar-footer{margin-top:auto;display:flex;flex-direction:column;gap:8px}.sidebar-link{display:flex;align-items:center;justify-content:center;width:100%;text-decoration:none;background:#0b1222;color:#fff;border:1px solid rgba(255,255,255,.12);padding:11px 14px;border-radius:11px;font-size:12px;font-weight:800;transition:.15s}.sidebar-link:hover{background:#172033;border-color:rgba(249,115,22,.45)}.sidebar-link.management{display:none;background:rgba(249,115,22,.12);border-color:rgba(249,115,22,.45);color:#fdba74}.sidebar-link.management.visible{display:flex}.map-wrap{position:relative;overflow:hidden;background:#91a8c5;cursor:grab}.map-wrap.dragging{cursor:grabbing}.map-wrap.adding{cursor:crosshair}.map-stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.map-img{width:7744px;height:7744px;display:block;user-select:none;pointer-events:none;image-rendering:auto}.marker{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:4}.marker-visual{width:var(--marker-size,20px);height:var(--marker-size,20px);transform:scale(var(--marker-comp,1));transform-origin:50% 100%;transition:transform .08s linear;display:grid;place-items:center}.marker::after{content:"";position:absolute;left:50%;bottom:-2px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.55);transform:translateX(-50%);pointer-events:none}.marker-icon{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55));pointer-events:none}.pin{width:100%;height:100%;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35);display:grid;place-items:center}.pin::after{content:"";width:28%;height:28%;border-radius:50%;background:#fff}.label{display:none}.marker:hover{z-index:20}.hover-name{position:absolute;z-index:30;display:none;pointer-events:none;white-space:nowrap;background:rgba(10,15,27,.97);color:#fff;border:2px solid rgba(249,115,22,.8);padding:10px 15px;border-radius:10px;font-size:20px;font-weight:900;line-height:1;letter-spacing:.01em;box-shadow:0 10px 30px rgba(0,0,0,.55);transform:translate(-50%,-100%);text-shadow:0 1px 2px #000}.hover-name.show{display:block}.controls{position:absolute;right:18px;top:18px;display:flex;flex-direction:column;gap:8px;z-index:11}.ctrl{width:42px;height:42px;border:none;border-radius:12px;background:rgba(15,23,42,.94);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer;font-size:20px}.coords{position:absolute;left:18px;bottom:70px;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.1);padding:8px 10px;border-radius:9px;font-size:11px;color:#cbd5e1;z-index:11}.add-point{position:absolute;left:18px;top:18px;z-index:12;border:0;background:var(--accent);color:#fff;padding:10px 14px;border-radius:11px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(249,115,22,.28);display:none}.add-point.active{background:#16a34a}.popup{position:absolute;min-width:250px;max-width:310px;background:#0f172a;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;z-index:15;box-shadow:0 18px 60px rgba(0,0,0,.45);display:none}.popup h3{margin:0 24px 4px 0;font-size:15px}.popup p{margin:0;color:#94a3b8;font-size:12px;line-height:1.45}.popup .tag{display:inline-flex;margin-top:9px;padding:4px 7px;border-radius:999px;font-size:10px;background:#1e293b;color:#cbd5e1}.popup .close{position:absolute;right:8px;top:7px;border:0;background:transparent;color:#94a3b8;font-size:20px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(2,6,23,.72);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}.modal.open{display:flex}.modal-card{width:min(470px,100%);background:#0f172a;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 25px 80px rgba(0,0,0,.45)}.modal-card h2{font-size:18px;margin:0 0 5px}.note{font-size:11px;color:#94a3b8;margin:0 0 14px}.row{display:grid;gap:7px;margin-top:11px}.row label{font-size:11px;color:#94a3b8}.row input,.row select,.row textarea{background:#0b1222;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}.row textarea{min-height:76px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.btn{border:0;border-radius:10px;padding:9px 12px;cursor:pointer}.secondary{background:#1e293b;color:#fff}.primary{background:var(--accent);color:#fff;font-weight:800}.form-msg{font-size:11px;color:#fca5a5;margin-top:9px;min-height:14px}.mobile-menu{display:none;position:absolute;left:18px;top:18px;z-index:13}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:absolute;left:12px;top:12px;bottom:12px;width:min(310px,calc(100% - 24px));transform:translateX(calc(-100% - 20px));transition:.2s;border:1px solid var(--line);border-radius:16px}.sidebar.open{transform:none}.mobile-menu{display:block}.add-point{left:70px}.coords{bottom:70px}}

.icon-picker{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  margin-top:8px;
}
.icon-choice{
  min-height:66px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#0b1222;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:8px;
  transition:.15s border-color,.15s background,.15s transform;
}
.icon-choice:hover{
  transform:translateY(-1px);
  background:#172033;
  border-color:rgba(249,115,22,.45);
}
.icon-choice.selected{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(249,115,22,.14);
  background:rgba(249,115,22,.08);
}
.icon-choice img{
  width:42px;
  height:42px;
  object-fit:contain;
  pointer-events:none;
}
.icon-choice.none{
  color:#94a3b8;
  font-size:11px;
  font-weight:800;
  text-align:center;
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">🗺️</div><div><h1>Vory V — Carte</h1><div class="subtitle">Carte interactive</div></div></div>
    <button class="sidebar-add" id="addPointBtn" disabled>＋ Ajouter un point</button>
    <div><div class="section-title">Catégories</div><div class="filters" id="filters"></div></div>
    <div><div class="section-title">Points</div><div class="list" id="pointList"><div class="empty">Clique sur une catégorie pour afficher ses points.</div></div></div>
    <div class="sidebar-footer"><a class="sidebar-link management" id="managementLink" href="gestion/">⚙ Gestion</a><a class="sidebar-link" href="index.html">← Page principale</a></div>
  </aside>
  <main class="map-wrap" id="mapWrap">
    <button class="ctrl mobile-menu" id="menuBtn">☰</button>
    <div class="map-stage" id="stage"><img class="map-img" src="map.webp" alt="Carte" draggable="false"><div id="markers"></div></div>
    <div class="controls"><button class="ctrl" id="zoomIn">＋</button><button class="ctrl" id="zoomOut">−</button><button class="ctrl" id="reset">⌂</button><button class="ctrl" id="fullscreen">⛶</button></div>
    <div class="coords" id="coords">x: — &nbsp; y: —</div>
    <div class="hover-name" id="hoverName"></div>
    <div class="popup" id="popup"><button class="close" id="closePopup">×</button><h3 id="popupTitle"></h3><p id="popupDesc"></p><span class="tag" id="popupTag"></span></div>
  </main>
</div>
<div class="modal" id="pointModal"><div class="modal-card">
  <h2>Ajouter un point</h2><p class="note" id="coordNote">Position : —</p>
  <div class="row"><label>Nom</label><input id="nameInput" placeholder="Ex. Commissariat"></div>
  <div class="row"><label>Description</label><textarea id="descInput" placeholder="Description facultative"></textarea></div>
  <div class="row"><label>Catégorie</label><select id="catInput"></select></div>
  <div class="row">
      <label>Icône</label>
      <input id="iconInput" type="hidden" value="">
      <div class="icon-picker" id="iconPicker"></div>
      <p class="note" style="margin:5px 0 0">Clique directement sur l’icône à utiliser.</p>
    </div>
  <div class="form-msg" id="formMsg"></div>
  <div class="actions"><button class="btn secondary" id="cancelAdd">Annuler</button><button class="btn primary" id="savePoint">Ajouter</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="database.js"></script>
<script>
const MAP_SIZE=7744;
const TABLE='map_points';
const ICON_BUCKET='icone map';
const ICON_FILES=Array.from({length:16},(_,i)=>`logo_${String(i+1).padStart(2,'0')}.png`);

function getMapIconUrl(value=''){
  const v=String(value||'').trim();
  if(!v)return '';

  // Compatibilité avec les anciens points qui auraient déjà une URL complète.
  if(/^https?:\/\//i.test(v))return v;

  const file=v.split('/').pop();
  const {data}=db.storage.from(ICON_BUCKET).getPublicUrl(file);
  return data?.publicUrl||'';
}
const fallbackColors={Lieu:'#3b82f6',Service:'#22c55e',Commerce:'#eab308',Zone:'#a855f7',Important:'#ef4444'};
let colors={...fallbackColors};
let categories=[];
let points=[],selectedCategory=null,scale=.1,fitScale=.1,x=0,y=0,dragging=false,sx=0,sy=0,bx=0,by=0;
let db=null,currentRole=null,currentProfile=null,fullMapAccess=false,addMode=false,pendingPoint=null;
const $=id=>document.getElementById(id),mapWrap=$('mapWrap'),stage=$('stage'),markersEl=$('markers');
if(window.vorySupabaseConfigured&&window.vorySupabaseConfigured()) db=window.supabase.createClient(window.VORY_SUPABASE_URL,window.VORY_SUPABASE_KEY);
function esc(s=''){return String(s).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

async function loadCategories(){
  if(!db)return;
  const {data,error}=await db.from('map_categories')
    .select('*')
    .eq('enabled',true)
    .order('sort_order',{ascending:true})
    .order('name',{ascending:true});

  if(error){
    console.warn('Catégories:',error.message);
    categories=Object.keys(fallbackColors).map((name,i)=>({
      name,
      color:fallbackColors[name],
      sort_order:i,
      is_public:name==='Entreprise'
    }));
    return;
  }

  categories=(data||[]).map(c=>({
    name:c.name,
    color:c.color||fallbackColors[c.name]||'#f97316',
    sort_order:c.sort_order||0,
    is_public:!!c.is_public
  }));

  if(!categories.length){
    categories=Object.keys(fallbackColors).map((name,i)=>({
      name,
      color:fallbackColors[name],
      sort_order:i,
      is_public:name==='Entreprise'
    }));
  }

  colors={...fallbackColors};
  categories.forEach(c=>colors[c.name]=c.color||'#f97316');
}


async function loadIcons(){
  if(!db)return;

  const picker=$('iconPicker');
  picker.innerHTML='';

  const none=document.createElement('button');
  none.type='button';
  none.className='icon-choice none selected';
  none.dataset.icon='';
  none.textContent='Aucune';
  picker.appendChild(none);

  ICON_FILES.forEach(file=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='icon-choice';
    btn.dataset.icon=file;

    const img=document.createElement('img');
    img.src=getMapIconUrl(file);
    img.alt=file;
    btn.appendChild(img);

    picker.appendChild(btn);
  });

  picker.querySelectorAll('.icon-choice').forEach(btn=>{
    btn.onclick=()=>{
      $('iconInput').value=btn.dataset.icon||'';
      picker.querySelectorAll('.icon-choice').forEach(x=>x.classList.toggle('selected',x===btn));
    };
  });
}

function canSeeCategory(category){
  if(fullMapAccess)return true;
  const cat=categories.find(c=>c.name===category);
  return !!cat?.is_public;
}

async function loadPoints(){
  if(!db)return;
  const {data,error}=await db.from(TABLE).select('*').order('name');
  if(error){console.error(error);return}
  points=(data||[])
    .map(p=>({id:p.id,name:p.name,desc:p.description||'',cat:p.category||'',x:Number(p.x),y:Number(p.y),icon:p.icon_url||''}))
    .filter(p=>canSeeCategory(p.cat));
  render();
}
async function loadRole(){
  const btn=$('addPointBtn');
  btn.disabled=true;
  btn.classList.remove('allowed');
  fullMapAccess=false;
  currentRole=null;
  currentProfile=null;

  if(!db)return;

  const {data:{session}}=await db.auth.getSession();

  if(session){
    const {data,error}=await db.from('profiles')
      .select('role,company_rank,gang_rank')
      .eq('id',session.user.id)
      .maybeSingle();

    if(!error&&data){
      currentProfile=data;
      currentRole=data.role||null;

      const gangAccess=['gang_member','right_hand','leader'].includes(data.gang_rank);
      const companyAccess=['manager','pdg'].includes(data.company_rank);
      const staffAccess=['admin','moderator'].includes(data.role);

      fullMapAccess=gangAccess||companyAccess||staffAccess;

      if(staffAccess){
        btn.disabled=false;
        btn.classList.add('allowed');
        const managementLink=$('managementLink');
        if(managementLink)managementLink.classList.add('visible');
      }
    }
  }

  await loadPoints();
}
function fit(){const r=mapWrap.getBoundingClientRect();fitScale=Math.min(r.width/MAP_SIZE,r.height/MAP_SIZE)*.97;scale=fitScale;x=r.width/2-MAP_SIZE*scale/2;y=r.height/2-MAP_SIZE*scale/2;apply()}
function apply(){stage.style.transform=`translate(${x}px,${y}px) scale(${scale})`;updateMarkerSizes()}
function updateMarkerSizes(){const ratio=Math.max(.2,scale/fitScale);const screenSize=Math.max(12,Math.min(30,14*Math.pow(ratio,.38)));const comp=screenSize/(20*scale);document.documentElement.style.setProperty('--marker-comp',comp)}
function zoomAt(f,cx,cy){const ns=Math.max(fitScale*.5,Math.min(2.4,scale*f)),mx=(cx-x)/scale,my=(cy-y)/scale;x=cx-mx*ns;y=cy-my*ns;scale=ns;apply()}
mapWrap.addEventListener('wheel',e=>{e.preventDefault();const r=mapWrap.getBoundingClientRect();zoomAt(e.deltaY<0?1.16:1/1.16,e.clientX-r.left,e.clientY-r.top)},{passive:false});
mapWrap.addEventListener('mousedown',e=>{if(addMode||e.button!==0)return;dragging=true;mapWrap.classList.add('dragging');sx=e.clientX;sy=e.clientY;bx=x;by=y});
window.addEventListener('mousemove',e=>{if(!dragging)return;x=bx+e.clientX-sx;y=by+e.clientY-sy;apply()});
window.addEventListener('mouseup',()=>{dragging=false;mapWrap.classList.remove('dragging')});
mapWrap.addEventListener('mousemove',e=>{const p=screenToMap(e);$('coords').textContent=p.inside?`x: ${Math.round(p.x)}   y: ${Math.round(p.y)}`:'x: —   y: —'});
mapWrap.addEventListener('click',e=>{if(!addMode||!currentRole)return;if(e.target.closest('.marker,.controls,.add-point,.mobile-menu,.popup'))return;const p=screenToMap(e);if(!p.inside)return;pendingPoint={x:p.x,y:p.y};$('coordNote').textContent=`Position : x ${Math.round(p.x)} · y ${Math.round(p.y)}`;$('pointModal').classList.add('open')});
function screenToMap(e){const r=mapWrap.getBoundingClientRect(),mx=(e.clientX-r.left-x)/scale,my=(e.clientY-r.top-y)/scale;return{x:mx,y:my,inside:mx>=0&&my>=0&&mx<=MAP_SIZE&&my<=MAP_SIZE}}
function render(){renderFilters();renderMarkers();renderList()}
function renderFilters(){
  const sourceCats=categories.length
    ? categories.map(c=>c.name)
    : [...new Set([...Object.keys(colors),...points.map(p=>p.cat)])];

  const cats=[...new Set([...sourceCats,...points.map(p=>p.cat)])].filter(canSeeCategory);

  if(selectedCategory&&!cats.includes(selectedCategory))selectedCategory=null;

  $('filters').innerHTML=cats.map(c=>`
    <div class="filter ${selectedCategory===c?'active':''}" data-cat="${esc(c)}">
      <div class="filter-left">
        <span class="dot" style="background:${colors[c]||'#f97316'}"></span>
        <span>${esc(c)}</span>
      </div>
      <span class="count">${points.filter(p=>p.cat===c).length}</span>
    </div>`).join('');

  document.querySelectorAll('.filter').forEach(el=>el.onclick=()=>{
    selectedCategory=selectedCategory===el.dataset.cat?null:el.dataset.cat;
    render();
  });

  const addCats=categories.length?categories.map(c=>c.name):Object.keys(colors);
  $('catInput').innerHTML=addCats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
}
function renderMarkers(){
  markersEl.innerHTML='';
  const hover=$('hoverName');
  points.forEach(p=>{
    const m=document.createElement('div');
    m.className='marker';m.dataset.id=p.id;m.style.left=p.x+'px';m.style.top=p.y+'px';
    const visual=p.icon?`<div class="marker-visual"><img class="marker-icon" src="${esc(getMapIconUrl(p.icon))}" alt=""></div>`:`<div class="marker-visual"><div class="pin" style="background:${colors[p.cat]||'#f97316'}"></div></div>`;
    m.innerHTML=visual;
    const showName=()=>{
      const rw=mapWrap.getBoundingClientRect(),mr=m.getBoundingClientRect();
      hover.textContent=p.name;
      hover.style.left=(mr.left-rw.left+mr.width/2)+'px';
      hover.style.top=Math.max(46,mr.top-rw.top-10)+'px';
      hover.classList.add('show');
    };
    m.addEventListener('mouseenter',showName);
    m.addEventListener('mousemove',showName);
    m.addEventListener('mouseleave',()=>hover.classList.remove('show'));
    m.onclick=e=>{e.stopPropagation();hover.classList.remove('show');showPopup(p,m)};
    markersEl.appendChild(m)
  })
}
function renderList(){const list=$('pointList');if(!selectedCategory){list.innerHTML='<div class="empty">Clique sur une catégorie pour afficher ses points.</div>';return}const filtered=points.filter(p=>p.cat===selectedCategory);list.innerHTML='';filtered.forEach(p=>{const li=document.createElement('div');li.className='list-item';li.innerHTML=`<b>${esc(p.name)}</b><span>${esc(p.cat)} · ${Math.round(p.x)}, ${Math.round(p.y)}</span>`;li.onclick=()=>focusPoint(p);list.appendChild(li)});if(!filtered.length)list.innerHTML='<div class="empty">Aucun point dans cette catégorie.</div>'}
function showPopup(p,m){const pop=$('popup'),rw=mapWrap.getBoundingClientRect(),mr=m.getBoundingClientRect();$('popupTitle').textContent=p.name;$('popupDesc').textContent=p.desc||'Aucune description';$('popupTag').textContent=p.cat;pop.style.display='block';pop.style.left=Math.max(15,Math.min(mr.left-rw.left+18,rw.width-330))+'px';pop.style.top=Math.max(15,mr.top-rw.top-30)+'px'}
function focusPoint(p){scale=Math.max(scale,fitScale*2.3);const r=mapWrap.getBoundingClientRect();x=r.width/2-p.x*scale;y=r.height/2-p.y*scale;apply();setTimeout(()=>{const marker=[...markersEl.children].find(el=>Number(el.dataset.id)===Number(p.id));if(marker)showPopup(p,marker)},30)}
$('zoomIn').onclick=()=>{const r=mapWrap.getBoundingClientRect();zoomAt(1.25,r.width/2,r.height/2)};$('zoomOut').onclick=()=>{const r=mapWrap.getBoundingClientRect();zoomAt(.8,r.width/2,r.height/2)};$('reset').onclick=fit;$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('closePopup').onclick=()=>$('popup').style.display='none';$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
$('addPointBtn').onclick=()=>{if(!currentRole)return;addMode=!addMode;$('addPointBtn').classList.toggle('active',addMode);$('addPointBtn').textContent=addMode?'Clique sur la carte…':'＋ Ajouter un point';mapWrap.classList.toggle('adding',addMode)};
$('cancelAdd').onclick=closeAddModal;function closeAddModal(){$('pointModal').classList.remove('open');pendingPoint=null;$('formMsg').textContent=''}
$('savePoint').onclick=async()=>{if(!db||!currentRole||!pendingPoint)return;const payload={name:$('nameInput').value.trim(),description:$('descInput').value.trim(),category:$('catInput').value,x:pendingPoint.x,y:pendingPoint.y,icon_url:$('iconInput').value.trim()||null};if(!payload.name){$('formMsg').textContent='Le nom est obligatoire.';return}const {error}=await db.from(TABLE).insert(payload);if(error){$('formMsg').textContent='Erreur : '+error.message;return}$('nameInput').value='';$('descInput').value='';$('iconInput').value='';
const picker=$('iconPicker');
if(picker)picker.querySelectorAll('.icon-choice').forEach(x=>x.classList.toggle('selected',x.dataset.icon===''));
closeAddModal();addMode=false;$('addPointBtn').classList.remove('active');$('addPointBtn').textContent='＋ Ajouter un point';mapWrap.classList.remove('adding');await loadPoints()};
window.addEventListener('resize',fit);fit();(async()=>{await Promise.all([loadCategories(),loadIcons()]);await loadRole()})();
</script>
</body></html>
