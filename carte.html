<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vory V — Carte interactive</title>
<style>
:root{--panel:#0f172a;--text:#f8fafc;--muted:#94a3b8;--line:rgba(255,255,255,.09);--accent:#f97316}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:#0b1020;color:var(--text);overflow:hidden}button,input,select,textarea{font:inherit}.app{height:100%;display:grid;grid-template-columns:330px 1fr}.sidebar{background:linear-gradient(180deg,#0f172a,#111827);border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:16px;z-index:10}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#fb923c,#ea580c);display:grid;place-items:center;font-size:21px}h1{font-size:18px;margin:0}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}.search{position:relative}.search input{width:100%;background:#0b1222;color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 38px;outline:none}.search span{position:absolute;left:13px;top:10px;color:var(--muted)}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#64748b;margin-bottom:8px}.filters{display:flex;flex-direction:column;gap:8px}.filter{display:flex;align-items:center;justify-content:space-between;background:#0b1222;border:1px solid var(--line);padding:9px 10px;border-radius:10px;cursor:pointer;transition:.15s}.filter:hover,.filter.active{background:#172033;border-color:rgba(249,115,22,.45)}.filter-left{display:flex;align-items:center;gap:9px}.dot{width:10px;height:10px;border-radius:50%}.count{font-size:11px;color:#64748b}.list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}.list-item{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#0b1222;cursor:pointer}.list-item b{font-size:12px;display:block}.list-item span{font-size:10px;color:#64748b}.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:#64748b;font-size:12px;line-height:1.45}.sidebar-footer{margin-top:auto}.map-wrap{position:relative;overflow:hidden;background:#91a8c5;cursor:grab}.map-wrap.dragging{cursor:grabbing}.map-wrap.adding{cursor:crosshair}.map-stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.map-img{width:7744px;height:7744px;display:block;user-select:none;pointer-events:none;image-rendering:auto}.marker{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:4}.marker-visual{width:var(--marker-size,28px);height:var(--marker-size,28px);transform:scale(var(--marker-comp,1));transform-origin:center;transition:transform .08s linear;display:grid;place-items:center}.marker-icon{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55));pointer-events:none}.pin{width:100%;height:100%;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35);display:grid;place-items:center}.pin::after{content:"";width:28%;height:28%;border-radius:50%;background:#fff}.label{position:absolute;left:20px;top:-28px;white-space:nowrap;background:rgba(15,23,42,.94);color:#fff;border:1px solid rgba(255,255,255,.12);padding:5px 8px;border-radius:8px;font-size:11px;opacity:0;pointer-events:none}.marker:hover{z-index:20}.marker:hover .label{opacity:1}.controls{position:absolute;right:18px;top:18px;display:flex;flex-direction:column;gap:8px;z-index:11}.ctrl{width:42px;height:42px;border:none;border-radius:12px;background:rgba(15,23,42,.94);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer;font-size:20px}.coords{position:absolute;left:18px;bottom:70px;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.1);padding:8px 10px;border-radius:9px;font-size:11px;color:#cbd5e1;z-index:11}.back-home{position:absolute;left:18px;bottom:18px;z-index:12;text-decoration:none;background:rgba(15,23,42,.94);color:#fff;border:1px solid rgba(255,255,255,.12);padding:10px 14px;border-radius:11px;font-size:12px;font-weight:700}.add-point{position:absolute;left:18px;top:18px;z-index:12;border:0;background:var(--accent);color:#fff;padding:10px 14px;border-radius:11px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(249,115,22,.28);display:none}.add-point.active{background:#16a34a}.popup{position:absolute;min-width:250px;max-width:310px;background:#0f172a;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;z-index:15;box-shadow:0 18px 60px rgba(0,0,0,.45);display:none}.popup h3{margin:0 24px 4px 0;font-size:15px}.popup p{margin:0;color:#94a3b8;font-size:12px;line-height:1.45}.popup .tag{display:inline-flex;margin-top:9px;padding:4px 7px;border-radius:999px;font-size:10px;background:#1e293b;color:#cbd5e1}.popup .close{position:absolute;right:8px;top:7px;border:0;background:transparent;color:#94a3b8;font-size:20px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(2,6,23,.72);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}.modal.open{display:flex}.modal-card{width:min(470px,100%);background:#0f172a;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 25px 80px rgba(0,0,0,.45)}.modal-card h2{font-size:18px;margin:0 0 5px}.note{font-size:11px;color:#94a3b8;margin:0 0 14px}.row{display:grid;gap:7px;margin-top:11px}.row label{font-size:11px;color:#94a3b8}.row input,.row select,.row textarea{background:#0b1222;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}.row textarea{min-height:76px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.btn{border:0;border-radius:10px;padding:9px 12px;cursor:pointer}.secondary{background:#1e293b;color:#fff}.primary{background:var(--accent);color:#fff;font-weight:800}.form-msg{font-size:11px;color:#fca5a5;margin-top:9px;min-height:14px}.mobile-menu{display:none;position:absolute;left:18px;top:18px;z-index:13}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:absolute;left:12px;top:12px;bottom:12px;width:min(310px,calc(100% - 24px));transform:translateX(calc(-100% - 20px));transition:.2s;border:1px solid var(--line);border-radius:16px}.sidebar.open{transform:none}.mobile-menu{display:block}.add-point{left:70px}.coords{bottom:70px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">🗺️</div><div><h1>Vory V — Carte</h1><div class="subtitle">Carte interactive</div></div></div>
    <div class="search"><span>⌕</span><input id="search" placeholder="Rechercher un point..."></div>
    <div><div class="section-title">Catégories</div><div class="filters" id="filters"></div></div>
    <div><div class="section-title">Points</div><div class="list" id="pointList"><div class="empty">Clique sur une catégorie pour afficher ses points.</div></div></div>
    <div class="sidebar-footer"></div>
  </aside>
  <main class="map-wrap" id="mapWrap">
    <button class="ctrl mobile-menu" id="menuBtn">☰</button>
    <button class="add-point" id="addPointBtn">＋ Ajouter un point</button>
    <div class="map-stage" id="stage"><img class="map-img" src="map.webp" alt="Carte" draggable="false"><div id="markers"></div></div>
    <div class="controls"><button class="ctrl" id="zoomIn">＋</button><button class="ctrl" id="zoomOut">−</button><button class="ctrl" id="reset">⌂</button><button class="ctrl" id="fullscreen">⛶</button></div>
    <div class="coords" id="coords">x: — &nbsp; y: —</div>
    <a class="back-home" href="index.html">← Page principale</a>
    <div class="popup" id="popup"><button class="close" id="closePopup">×</button><h3 id="popupTitle"></h3><p id="popupDesc"></p><span class="tag" id="popupTag"></span></div>
  </main>
</div>
<div class="modal" id="pointModal"><div class="modal-card">
  <h2>Ajouter un point</h2><p class="note" id="coordNote">Position : —</p>
  <div class="row"><label>Nom</label><input id="nameInput" placeholder="Ex. Commissariat"></div>
  <div class="row"><label>Description</label><textarea id="descInput" placeholder="Description facultative"></textarea></div>
  <div class="row"><label>Catégorie</label><select id="catInput"></select></div>
  <div class="row"><label>Logo / icône (URL publique)</label><input id="iconInput" placeholder="https://.../logo.png"><small style="color:#64748b">Colle ici l’URL publique du logo stocké dans Supabase Storage.</small></div>
  <div class="form-msg" id="formMsg"></div>
  <div class="actions"><button class="btn secondary" id="cancelAdd">Annuler</button><button class="btn primary" id="savePoint">Ajouter</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="database.js"></script>
<script>
const MAP_SIZE=7744;
const TABLE='map_points';
const colors={Lieu:'#3b82f6',Service:'#22c55e',Commerce:'#eab308',Zone:'#a855f7',Important:'#ef4444'};
let points=[],selectedCategory=null,scale=.1,fitScale=.1,x=0,y=0,dragging=false,sx=0,sy=0,bx=0,by=0;
let db=null,currentRole=null,addMode=false,pendingPoint=null;
const $=id=>document.getElementById(id),mapWrap=$('mapWrap'),stage=$('stage'),markersEl=$('markers');
if(window.vorySupabaseConfigured&&window.vorySupabaseConfigured()) db=window.supabase.createClient(window.VORY_SUPABASE_URL,window.VORY_SUPABASE_KEY);
function esc(s=''){return String(s).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadPoints(){if(!db)return;const {data,error}=await db.from(TABLE).select('*').order('name');if(error){console.error(error);return}points=(data||[]).map(p=>({id:p.id,name:p.name,desc:p.description||'',cat:p.category||'Lieu',x:Number(p.x),y:Number(p.y),icon:p.icon_url||''}));render()}
async function loadRole(){if(!db)return;const {data:{session}}=await db.auth.getSession();if(!session)return;const {data}=await db.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(data&&['admin','moderator'].includes(data.role)){currentRole=data.role;$('addPointBtn').style.display='block'}}
function fit(){const r=mapWrap.getBoundingClientRect();fitScale=Math.min(r.width/MAP_SIZE,r.height/MAP_SIZE)*.97;scale=fitScale;x=r.width/2-MAP_SIZE*scale/2;y=r.height/2-MAP_SIZE*scale/2;apply()}
function apply(){stage.style.transform=`translate(${x}px,${y}px) scale(${scale})`;updateMarkerSizes()}
function updateMarkerSizes(){const ratio=Math.max(.2,scale/fitScale);const screenSize=Math.max(20,Math.min(52,22*Math.pow(ratio,.45)));const comp=screenSize/(28*scale);document.documentElement.style.setProperty('--marker-comp',comp)}
function zoomAt(f,cx,cy){const ns=Math.max(fitScale*.5,Math.min(2.4,scale*f)),mx=(cx-x)/scale,my=(cy-y)/scale;x=cx-mx*ns;y=cy-my*ns;scale=ns;apply()}
mapWrap.addEventListener('wheel',e=>{e.preventDefault();const r=mapWrap.getBoundingClientRect();zoomAt(e.deltaY<0?1.16:1/1.16,e.clientX-r.left,e.clientY-r.top)},{passive:false});
mapWrap.addEventListener('mousedown',e=>{if(addMode||e.button!==0)return;dragging=true;mapWrap.classList.add('dragging');sx=e.clientX;sy=e.clientY;bx=x;by=y});
window.addEventListener('mousemove',e=>{if(!dragging)return;x=bx+e.clientX-sx;y=by+e.clientY-sy;apply()});
window.addEventListener('mouseup',()=>{dragging=false;mapWrap.classList.remove('dragging')});
mapWrap.addEventListener('mousemove',e=>{const p=screenToMap(e);$('coords').textContent=p.inside?`x: ${Math.round(p.x)}   y: ${Math.round(p.y)}`:'x: —   y: —'});
mapWrap.addEventListener('click',e=>{if(!addMode||!currentRole)return;if(e.target.closest('.marker,.controls,.back-home,.add-point,.mobile-menu,.popup'))return;const p=screenToMap(e);if(!p.inside)return;pendingPoint={x:p.x,y:p.y};$('coordNote').textContent=`Position : x ${Math.round(p.x)} · y ${Math.round(p.y)}`;$('pointModal').classList.add('open')});
function screenToMap(e){const r=mapWrap.getBoundingClientRect(),mx=(e.clientX-r.left-x)/scale,my=(e.clientY-r.top-y)/scale;return{x:mx,y:my,inside:mx>=0&&my>=0&&mx<=MAP_SIZE&&my<=MAP_SIZE}}
function render(){renderFilters();renderMarkers();renderList()}
function renderFilters(){const cats=[...new Set([...Object.keys(colors),...points.map(p=>p.cat)])];$('filters').innerHTML=cats.map(c=>`<div class="filter ${selectedCategory===c?'active':''}" data-cat="${esc(c)}"><div class="filter-left"><span class="dot" style="background:${colors[c]||'#f97316'}"></span><span>${esc(c)}</span></div><span class="count">${points.filter(p=>p.cat===c).length}</span></div>`).join('');document.querySelectorAll('.filter').forEach(el=>el.onclick=()=>{selectedCategory=selectedCategory===el.dataset.cat?null:el.dataset.cat;render()});$('catInput').innerHTML=cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}
function visibleBySearch(p){const q=$('search').value.trim().toLowerCase();return !q||(p.name+' '+p.desc+' '+p.cat).toLowerCase().includes(q)}
function renderMarkers(){markersEl.innerHTML='';points.filter(visibleBySearch).forEach(p=>{const m=document.createElement('div');m.className='marker';m.style.left=p.x+'px';m.style.top=p.y+'px';const visual=p.icon?`<div class="marker-visual"><img class="marker-icon" src="${esc(p.icon)}" alt=""></div>`:`<div class="marker-visual"><div class="pin" style="background:${colors[p.cat]||'#f97316'}"></div></div>`;m.innerHTML=visual+`<div class="label">${esc(p.name)}</div>`;m.onclick=e=>{e.stopPropagation();showPopup(p,m)};markersEl.appendChild(m)})}
function renderList(){const list=$('pointList');if(!selectedCategory){list.innerHTML='<div class="empty">Clique sur une catégorie pour afficher ses points.</div>';return}const filtered=points.filter(p=>p.cat===selectedCategory&&visibleBySearch(p));list.innerHTML='';filtered.forEach(p=>{const li=document.createElement('div');li.className='list-item';li.innerHTML=`<b>${esc(p.name)}</b><span>${esc(p.cat)} · ${Math.round(p.x)}, ${Math.round(p.y)}</span>`;li.onclick=()=>focusPoint(p);list.appendChild(li)});if(!filtered.length)list.innerHTML='<div class="empty">Aucun point dans cette catégorie.</div>'}
function showPopup(p,m){const pop=$('popup'),rw=mapWrap.getBoundingClientRect(),mr=m.getBoundingClientRect();$('popupTitle').textContent=p.name;$('popupDesc').textContent=p.desc||'Aucune description';$('popupTag').textContent=p.cat;pop.style.display='block';pop.style.left=Math.max(15,Math.min(mr.left-rw.left+18,rw.width-330))+'px';pop.style.top=Math.max(15,mr.top-rw.top-30)+'px'}
function focusPoint(p){scale=Math.max(scale,fitScale*2.3);const r=mapWrap.getBoundingClientRect();x=r.width/2-p.x*scale;y=r.height/2-p.y*scale;apply()}
$('search').oninput=render;$('zoomIn').onclick=()=>{const r=mapWrap.getBoundingClientRect();zoomAt(1.25,r.width/2,r.height/2)};$('zoomOut').onclick=()=>{const r=mapWrap.getBoundingClientRect();zoomAt(.8,r.width/2,r.height/2)};$('reset').onclick=fit;$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('closePopup').onclick=()=>$('popup').style.display='none';$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
$('addPointBtn').onclick=()=>{addMode=!addMode;$('addPointBtn').classList.toggle('active',addMode);$('addPointBtn').textContent=addMode?'Clique sur la carte…':'＋ Ajouter un point';mapWrap.classList.toggle('adding',addMode)};
$('cancelAdd').onclick=closeAddModal;function closeAddModal(){$('pointModal').classList.remove('open');pendingPoint=null;$('formMsg').textContent=''}
$('savePoint').onclick=async()=>{if(!db||!currentRole||!pendingPoint)return;const payload={name:$('nameInput').value.trim(),description:$('descInput').value.trim(),category:$('catInput').value,x:pendingPoint.x,y:pendingPoint.y,icon_url:$('iconInput').value.trim()||null};if(!payload.name){$('formMsg').textContent='Le nom est obligatoire.';return}const {error}=await db.from(TABLE).insert(payload);if(error){$('formMsg').textContent='Erreur : '+error.message;return}$('nameInput').value='';$('descInput').value='';$('iconInput').value='';closeAddModal();addMode=false;$('addPointBtn').classList.remove('active');$('addPointBtn').textContent='＋ Ajouter un point';mapWrap.classList.remove('adding');await loadPoints()};
window.addEventListener('resize',fit);fit();loadPoints();loadRole();
</script>
</body></html>
