<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vory V — Carte interactive</title>
<style>
:root{--panel:#0f172a;--text:#f8fafc;--muted:#94a3b8;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:#0b1020;color:var(--text);overflow:hidden}button,input{font:inherit}.app{height:100%;display:grid;grid-template-columns:330px 1fr}.sidebar{background:linear-gradient(180deg,#0f172a,#111827);border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:16px;z-index:10}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#fb923c,#ea580c);display:grid;place-items:center;font-size:21px}h1{font-size:18px;margin:0}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}.search{position:relative}.search input{width:100%;background:#0b1222;color:white;border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 38px;outline:none}.search span{position:absolute;left:13px;top:10px;color:var(--muted)}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#64748b;margin-bottom:8px}.filters{display:flex;flex-direction:column;gap:8px}.filter{display:flex;align-items:center;justify-content:space-between;background:#0b1222;border:1px solid var(--line);padding:9px 10px;border-radius:10px;cursor:pointer}.filter-left{display:flex;align-items:center;gap:9px}.dot{width:10px;height:10px;border-radius:50%}.count{font-size:11px;color:#64748b}.list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}.list-item{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#0b1222;cursor:pointer}.list-item b{font-size:12px;display:block}.list-item span{font-size:10px;color:#64748b}.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:#64748b;font-size:12px}.sidebar-footer{margin-top:auto;font-size:11px;color:#64748b;line-height:1.5}.map-wrap{position:relative;overflow:hidden;background:#91a8c5;cursor:grab}.map-wrap.dragging{cursor:grabbing}.map-stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.map-img{width:7744px;height:7744px;display:block;user-select:none;pointer-events:none;image-rendering:auto}.marker{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:4}.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid white;box-shadow:0 4px 12px rgba(0,0,0,.35);display:grid;place-items:center}.pin::after{content:"";width:8px;height:8px;border-radius:50%;background:white}.label{position:absolute;left:18px;top:-27px;white-space:nowrap;background:rgba(15,23,42,.94);color:white;border:1px solid rgba(255,255,255,.12);padding:5px 8px;border-radius:8px;font-size:11px;opacity:0;transition:.15s;pointer-events:none}.marker:hover .label{opacity:1}.controls{position:absolute;right:18px;top:18px;display:flex;flex-direction:column;gap:8px;z-index:11}.ctrl{width:42px;height:42px;border:none;border-radius:12px;background:rgba(15,23,42,.94);color:white;box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer;font-size:20px}.coords{position:absolute;left:18px;bottom:70px;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.1);padding:8px 10px;border-radius:9px;font-size:11px;color:#cbd5e1;z-index:11}.back-home{position:absolute;left:18px;bottom:18px;z-index:12;text-decoration:none;background:rgba(15,23,42,.94);color:#fff;border:1px solid rgba(255,255,255,.12);padding:10px 14px;border-radius:11px;font-size:12px;font-weight:700}.hint{position:absolute;right:18px;bottom:18px;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.1);padding:8px 10px;border-radius:9px;font-size:11px;color:#cbd5e1;z-index:11}.popup{position:absolute;min-width:250px;max-width:310px;background:#0f172a;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;z-index:15;box-shadow:0 18px 60px rgba(0,0,0,.45);display:none}.popup h3{margin:0 24px 4px 0;font-size:15px}.popup p{margin:0;color:#94a3b8;font-size:12px;line-height:1.45}.popup .tag{display:inline-flex;margin-top:9px;padding:4px 7px;border-radius:999px;font-size:10px;background:#1e293b;color:#cbd5e1}.popup .close{position:absolute;right:8px;top:7px;border:0;background:transparent;color:#94a3b8;font-size:20px;cursor:pointer}.mobile-menu{display:none;position:absolute;left:18px;top:18px;z-index:13}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:absolute;left:12px;top:12px;bottom:12px;width:min(310px,calc(100% - 24px));transform:translateX(calc(-100% - 20px));transition:.2s;border:1px solid var(--line);border-radius:16px}.sidebar.open{transform:none}.mobile-menu{display:block}.hint{display:none}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">🗺️</div><div><h1>Vory V — Carte</h1><div class="subtitle">Carte interactive</div></div></div><div class="search"><span>⌕</span><input id="search" placeholder="Rechercher un point..."></div><div><div class="section-title">Catégories</div><div class="filters" id="filters"></div></div><div><div class="section-title">Points</div><div class="list" id="pointList"></div></div><div class="sidebar-footer">Molette : zoom sous la souris · Glisser : déplacer</div></aside><main class="map-wrap" id="mapWrap"><button class="ctrl mobile-menu" id="menuBtn">☰</button><div class="map-stage" id="stage"><img class="map-img" src="map.webp" alt="Carte" draggable="false"><div id="markers"></div></div><div class="controls"><button class="ctrl" id="zoomIn">＋</button><button class="ctrl" id="zoomOut">−</button><button class="ctrl" id="reset">⌂</button><button class="ctrl" id="fullscreen">⛶</button></div><div class="coords" id="coords">x: — &nbsp; y: —</div><a class="back-home" href="index.html">← Page principale</a><div class="hint">Molette : zoom sur la souris · Glisser : déplacer</div><div class="popup" id="popup"><button class="close" id="closePopup">×</button><h3 id="popupTitle"></h3><p id="popupDesc"></p><span class="tag" id="popupTag"></span></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="database.js"></script>
<script>
const MAP_SIZE=7744, STORAGE_KEY='customMapPoints';const colors={Lieu:'#3b82f6',Service:'#22c55e',Commerce:'#eab308',Zone:'#a855f7',Important:'#ef4444'};let points=[],activeCats=new Set(Object.keys(colors));let scale=.1,x=0,y=0,dragging=false,sx=0,sy=0,bx=0,by=0;const mapWrap=document.getElementById('mapWrap'),stage=document.getElementById('stage'),markersEl=document.getElementById('markers');
const db=window.vorySupabaseConfigured&&window.vorySupabaseConfigured()?window.supabase.createClient(window.VORY_SUPABASE_URL,window.VORY_SUPABASE_KEY):null;
async function loadPoints(){if(db){const {data,error}=await db.from('map_points').select('*').order('name');if(!error){points=(data||[]).map(p=>({id:p.id,name:p.name,desc:p.description||'',cat:p.category,x:Number(p.x),y:Number(p.y)}));render();return}}points=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');render()}
function fit(){const r=mapWrap.getBoundingClientRect();scale=Math.min(r.width/MAP_SIZE,r.height/MAP_SIZE)*.97;x=r.width/2-MAP_SIZE*scale/2;y=r.height/2-MAP_SIZE*scale/2;apply()}function apply(){stage.style.transform=`translate(${x}px,${y}px) scale(${scale})`}function zoomAt(f,cx,cy){const fitScale=Math.min(mapWrap.clientWidth/MAP_SIZE,mapWrap.clientHeight/MAP_SIZE)*.97,ns=Math.max(fitScale*.35,Math.min(2.4,scale*f)),mx=(cx-x)/scale,my=(cy-y)/scale;x=cx-mx*ns;y=cy-my*ns;scale=ns;apply()}
mapWrap.addEventListener('wheel',e=>{e.preventDefault();const r=mapWrap.getBoundingClientRect();zoomAt(e.deltaY<0?1.16:1/1.16,e.clientX-r.left,e.clientY-r.top)},{passive:false});mapWrap.addEventListener('mousedown',e=>{dragging=true;mapWrap.classList.add('dragging');sx=e.clientX;sy=e.clientY;bx=x;by=y});window.addEventListener('mousemove',e=>{if(!dragging)return;x=bx+e.clientX-sx;y=by+e.clientY-sy;apply()});window.addEventListener('mouseup',()=>{dragging=false;mapWrap.classList.remove('dragging')});mapWrap.addEventListener('mousemove',e=>{const r=mapWrap.getBoundingClientRect(),mx=(e.clientX-r.left-x)/scale,my=(e.clientY-r.top-y)/scale;document.getElementById('coords').textContent=mx>=0&&my>=0&&mx<=MAP_SIZE&&my<=MAP_SIZE?`x: ${Math.round(mx)}   y: ${Math.round(my)}`:'x: —   y: —'});
function esc(s=''){return String(s).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function render(){markersEl.innerHTML='';const q=document.getElementById('search').value.toLowerCase(),list=document.getElementById('pointList');list.innerHTML='';points.forEach(p=>{if(!activeCats.has(p.cat)||!(p.name+' '+(p.desc||'')).toLowerCase().includes(q))return;const m=document.createElement('div');m.className='marker';m.style.left=p.x+'px';m.style.top=p.y+'px';m.innerHTML=`<div class="pin" style="background:${colors[p.cat]||'#f97316'}"></div><div class="label">${esc(p.name)}</div>`;m.onclick=e=>{e.stopPropagation();showPopup(p,m)};markersEl.appendChild(m);const li=document.createElement('div');li.className='list-item';li.innerHTML=`<b>${esc(p.name)}</b><span>${esc(p.cat)} · ${Math.round(p.x)}, ${Math.round(p.y)}</span>`;li.onclick=()=>focusPoint(p);list.appendChild(li)});document.getElementById('filters').innerHTML=Object.keys(colors).map(c=>`<div class="filter" data-cat="${c}"><div class="filter-left"><span class="dot" style="background:${colors[c]};opacity:${activeCats.has(c)?1:.25}"></span><span>${c}</span></div><span class="count">${points.filter(p=>p.cat===c).length}</span></div>`).join('');document.querySelectorAll('.filter').forEach(el=>el.onclick=()=>{const c=el.dataset.cat;activeCats.has(c)?activeCats.delete(c):activeCats.add(c);render()});if(!list.children.length)list.innerHTML='<div class="empty">Aucun point à afficher.</div>'}
function showPopup(p,m){const pop=document.getElementById('popup'),rw=mapWrap.getBoundingClientRect(),mr=m.getBoundingClientRect();document.getElementById('popupTitle').textContent=p.name;document.getElementById('popupDesc').textContent=p.desc||'Aucune description';document.getElementById('popupTag').textContent=p.cat;pop.style.display='block';pop.style.left=Math.max(15,Math.min(mr.left-rw.left+18,rw.width-330))+'px';pop.style.top=Math.max(15,mr.top-rw.top-30)+'px'}function focusPoint(p){scale=Math.max(scale,.32);const r=mapWrap.getBoundingClientRect();x=r.width/2-p.x*scale;y=r.height/2-p.y*scale;apply()}
document.getElementById('search').oninput=render;document.getElementById('zoomIn').onclick=()=>{const r=mapWrap.getBoundingClientRect();zoomAt(1.25,r.width/2,r.height/2)};document.getElementById('zoomOut').onclick=()=>{const r=mapWrap.getBoundingClientRect();zoomAt(.8,r.width/2,r.height/2)};document.getElementById('reset').onclick=fit;document.getElementById('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.getElementById('closePopup').onclick=()=>document.getElementById('popup').style.display='none';document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');window.addEventListener('resize',fit);fit();loadPoints();
</script></body></html>
