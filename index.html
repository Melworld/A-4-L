<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vory V</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;overflow:hidden}
    body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.075),transparent 0 30%),radial-gradient(circle at 50% 50%,rgba(255,255,255,.025),transparent 0 58%);pointer-events:none}
    .home{position:relative;z-index:1;width:min(900px,calc(100% - 36px));text-align:center;animation:appear .6s ease both}
    .title{margin:0 0 46px;font-size:clamp(72px,12vw,160px);line-height:.88;font-weight:950;letter-spacing:-.07em;text-transform:uppercase;text-shadow:0 0 38px rgba(255,255,255,.08)}
    .buttons{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.btn{min-width:220px;padding:16px 28px;border:1px solid rgba(255,255,255,.24);border-radius:12px;background:#fff;color:#050505;text-decoration:none;font-size:14px;font-weight:850;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:.18s ease}.btn:hover{transform:translateY(-3px);background:transparent;color:#fff;border-color:rgba(255,255,255,.72)}.btn.secondary{background:transparent;color:#fff}.btn.secondary:hover{background:#fff;color:#050505}
    @keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:560px){.title{margin-bottom:34px}.buttons{flex-direction:column}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="home">
    <h1 class="title">Vory V</h1>
    <div class="buttons">
      <a class="btn" href="carte.html">Carte interactive</a>
      <a class="btn secondary" href="gestion/">Gestion</a>
    </div>
  </main>
</body>
</html>
