<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vory V — Mon profil</title><style>
:root{
  --bg:#09090b;--panel:#111113;--panel2:#151518;--muted:#8b8b94;--line:#25252b;
  --accent:#f97316;--accent2:#fb923c;--danger:#7f1d1d;--ok:#166534;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
button,input,select,textarea{font:inherit}
a{color:inherit}
.hidden{display:none!important}
.page-shell{max-width:1180px;margin:0 auto;padding:34px 24px 80px}
.page-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:52px}
.page-kicker{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.page-top h1{margin:0;font-size:34px;letter-spacing:-.02em}
.back-link{color:#aaa;text-decoration:none;font-weight:800;margin-top:8px}.back-link:hover{color:#fff}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.btn{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{background:var(--accent);color:#111}.btn.primary:hover{background:var(--accent2)}
.btn.secondary{background:#1b1b1f;color:#fff;border:1px solid #303036}
.btn.danger{background:#3a1518;color:#fecaca;border:1px solid #5f2227}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.row{display:grid;gap:7px;margin-bottom:12px}
.row label{font-size:13px;font-weight:800;color:#d4d4d8}
.row input,.row select,.row textarea{width:100%;background:#0c0c0e;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}
.row textarea{min-height:85px;resize:vertical}
.row input:focus,.row select:focus,.row textarea:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.section-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.section-nav a{padding:9px 12px;border:1px solid var(--line);border-radius:9px;color:#aaa;text-decoration:none;font-size:13px;font-weight:800}
.section-nav a:hover{background:#18181b;color:#fff}
.member-panel{display:flex;align-items:center;gap:18px;padding:20px 22px;background:linear-gradient(180deg,#131316,#0f0f12);border:1px solid var(--line);border-radius:18px;margin-bottom:26px}
.member-avatar{width:82px;height:82px;border-radius:50%;overflow:hidden;background:#1b1b20;border:1px solid #33333a;display:grid;place-items:center;font-size:30px;flex:none}
.member-avatar img{width:100%;height:100%;object-fit:cover}
.member-name{font-size:25px;font-weight:950;letter-spacing:-.02em}
.member-role{color:#c7c7ce;font-size:14px;font-weight:800;margin-top:2px}
.member-details{display:flex;gap:10px 20px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:13px}
.member-details b{color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:15px}
.top h2{margin:0}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:#0d0d10;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.stat b{font-size:18px}
@media(max-width:760px){
  .page-shell{padding:24px 14px 60px}.page-top{margin-bottom:36px}.grid,.stat-grid{grid-template-columns:1fr}
  .member-panel{align-items:flex-start}.member-details{display:grid;gap:5px}.page-top h1{font-size:28px}
}

.profile-info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.profile-info-grid .stat{min-width:0}
.profile-info-grid .stat b{display:block;overflow-wrap:anywhere;word-break:break-word;white-space:normal;line-height:1.35}
.profile-info-grid .email-stat b{font-size:15px}
.profile-info-grid .empty-stat{visibility:hidden}
@media(max-width:650px){
  .profile-info-grid{grid-template-columns:1fr}
  .profile-info-grid .empty-stat{display:none}
}

</style></head>
<body><div class="page-shell">
<div class="page-top"><div><div class="page-kicker">Vory V — Espace Gestion</div><h1>Mon profil</h1></div><a class="back-link" href="../">← Retour à la gestion</a></div>
<div class="card" style="padding:24px">
  <div class="member-panel" style="margin:0;border:0;padding:0;background:transparent">
    <button class="member-avatar" id="profileAvatar" type="button" style="cursor:pointer;color:#fff">👤</button>
    <div>
      <div class="member-name" id="profileName">—</div>
      <div class="muted" id="avatarMsg" style="margin-top:6px">Clique sur la photo pour la modifier.</div>
    </div>
  </div>
  <input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
</div>
<div class="card">
  <h2 style="margin-top:0">Mes informations</h2>
  <div class="profile-info-grid">
    <div class="stat"><span>Rang</span><b id="profileRank">—</b></div>
    <div class="stat"><span>Argent</span><b id="profileMoney">0 $</b></div>
    <div class="stat"><span>Numéro</span><b id="profileNumber">—</b></div>
    <div class="stat email-stat"><span>Email</span><b id="profileEmail">—</b></div>
  </div>
</div>
<div class="card">
  <h2 style="margin-top:0">Modifier mon mot de passe</h2>
  <div class="row"><label>Ancien mot de passe</label><input id="oldPw" type="password" autocomplete="current-password"></div>
  <div class="row"><label>Nouveau mot de passe</label><input id="pw1" type="password" autocomplete="new-password"></div>
  <div class="row"><label>Confirmer le nouveau mot de passe</label><input id="pw2" type="password" autocomplete="new-password"></div>
  <button class="btn primary" id="changePw">Enregistrer</button><div class="muted" id="pwMsg" style="margin-top:10px"></div>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../database.js"></script>
<script>
const $=id=>document.getElementById(id);
let db=null,currentUser=null,currentProfile=null;
if(window.vorySupabaseConfigured&&window.vorySupabaseConfigured()){
  db=window.supabase.createClient(window.VORY_SUPABASE_URL,window.VORY_SUPABASE_KEY);
}
function roleLabel(role){
  if(role==='admin') return 'Administrateur';
  if(role==='moderator') return 'Modérateur';
  return 'Membre';
}
function renderMemberPanel(){
  if($('memberName')) $('memberName').textContent=currentProfile.rp_name||'Sans Nom RP';
  if($('memberRole')) $('memberRole').textContent=roleLabel(currentProfile.role);
  if($('memberNumber')) $('memberNumber').textContent=currentProfile.member_number||'Non attribué';
  if($('memberEmail')) $('memberEmail').textContent=currentUser.email||'—';
  if($('memberMoney')) $('memberMoney').textContent=Number(currentProfile.money||0).toLocaleString('fr-FR')+' $';
  if($('memberAvatar')&&currentProfile.avatar_url){
    const clean=String(currentProfile.avatar_url).split('?v=')[0];
    $('memberAvatar').innerHTML='<img src="'+clean+'?v='+Date.now()+'" alt="Photo de profil">';
  }
  if(currentProfile.role==='member'){
    if($('navPoints')) $('navPoints').style.display='none';
    if($('navSite')) $('navSite').style.display='none';
    if($('navAccounts')) $('navAccounts').style.display='none';
  } else if(currentProfile.role==='moderator'){
    if($('navSite')) $('navSite').style.display='none';
    if($('navAccounts')) $('navAccounts').style.display='none';
  }
}
async function loadIdentity(allowedRoles=['member','moderator','admin']){
  if(!db){ location.href='../'; return false; }
  const {data:{session}}=await db.auth.getSession();
  currentUser=session?.user||null;
  if(!currentUser){ location.href='../'; return false; }
  const {data,error}=await db.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
  if(error||!data){ location.href='../'; return false; }
  currentProfile=data;
  if(!allowedRoles.includes(currentProfile.role)){ location.href='../'; return false; }
  renderMemberPanel();
  return true;
}


function setProfileAvatar(url){if(!url){$('profileAvatar').innerHTML='👤';return}const clean=String(url).split('?v=')[0];$('profileAvatar').innerHTML='<img src="'+clean+'?v='+Date.now()+'" alt="Photo">'}
$('profileAvatar').onclick=()=>$('avatarInput').click();
$('avatarInput').onchange=async e=>{
  const file=e.target.files?.[0];e.target.value='';if(!file)return;
  if(!['image/png','image/jpeg','image/webp'].includes(file.type)){return $('avatarMsg').textContent='PNG, JPG ou WEBP uniquement.'}
  if(file.size>5*1024*1024){return $('avatarMsg').textContent='5 Mo maximum.'}
  $('avatarMsg').textContent='Envoi...';const ext=(file.name.split('.').pop()||'webp').toLowerCase().replace(/[^a-z0-9]/g,'');const path=currentUser.id+'/avatar.'+ext;
  const {error:upErr}=await db.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type,cacheControl:'3600'});if(upErr){$('avatarMsg').textContent='Erreur : '+upErr.message;return}
  const {data:pub}=db.storage.from('avatars').getPublicUrl(path);const url=pub?.publicUrl;if(!url){$('avatarMsg').textContent='URL introuvable.';return}
  const {error}=await db.from('profiles').update({avatar_url:url}).eq('id',currentUser.id);if(error){$('avatarMsg').textContent='Erreur profil : '+error.message;return}
  currentProfile.avatar_url=url;setProfileAvatar(url);$('avatarMsg').textContent='Photo mise à jour.';
}
$('changePw').onclick=async()=>{
  const oldPassword=$('oldPw').value;
  const newPassword=$('pw1').value;
  const confirmPassword=$('pw2').value;
  const msg=$('pwMsg');

  msg.textContent='';

  if(!oldPassword){
    msg.textContent='Entre ton ancien mot de passe.';
    return;
  }
  if(newPassword.length<8){
    msg.textContent='Le nouveau mot de passe doit contenir au moins 8 caractères.';
    return;
  }
  if(newPassword!==confirmPassword){
    msg.textContent='Les deux nouveaux mots de passe ne correspondent pas.';
    return;
  }
  if(oldPassword===newPassword){
    msg.textContent='Le nouveau mot de passe doit être différent de l’ancien.';
    return;
  }

  msg.textContent='Vérification de l’ancien mot de passe...';

  const {error:verifyError}=await db.auth.signInWithPassword({
    email:currentUser.email,
    password:oldPassword
  });

  if(verifyError){
    msg.textContent='Ancien mot de passe incorrect.';
    return;
  }

  const {error:updateError}=await db.auth.updateUser({password:newPassword});

  if(updateError){
    msg.textContent='Impossible de modifier le mot de passe : '+updateError.message;
    return;
  }

  $('oldPw').value='';
  $('pw1').value='';
  $('pw2').value='';
  msg.textContent='Mot de passe modifié avec succès.';
}
async function initPage(){
  $('profileName').textContent=currentProfile.rp_name||'Sans Nom RP';
  $('profileRank').textContent=roleLabel(currentProfile.role);
  $('profileMoney').textContent=Number(currentProfile.money||0).toLocaleString('fr-FR')+' $';
  $('profileNumber').textContent=currentProfile.member_number||'Non attribué';
  $('profileEmail').textContent=currentUser.email||'—';
  setProfileAvatar(currentProfile.avatar_url);
}

(async()=>{if(await loadIdentity(['member','moderator','admin'])){if(typeof initPage==='function')await initPage();}})();
</script></body></html>
