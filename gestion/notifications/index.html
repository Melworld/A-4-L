<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vory V — Notifications</title>
<style>
:root{
  --bg:#09090b;
  --panel:#111113;
  --panel2:#17171b;
  --line:#28282f;
  --text:#fff;
  --muted:#92929d;
  --orange:#f97316;
  --orange2:#fb923c;
  --green:#22c55e;
  --red:#ef4444;
  --blue:#60a5fa;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 0,rgba(249,115,22,.08),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
a{color:inherit;text-decoration:none}
button{font:inherit}
.shell{max-width:1050px;margin:auto;padding:30px 22px 70px}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  margin-bottom:28px;
}
.kicker{
  color:var(--orange);
  font-weight:950;
  letter-spacing:.15em;
  font-size:11px;
  text-transform:uppercase;
}
h1{margin:5px 0 0;font-size:34px}
.back{color:#aaa;font-weight:800}
.back:hover{color:#fff}
.card{
  background:linear-gradient(180deg,#121215,#0f0f12);
  border:1px solid var(--line);
  border-radius:17px;
  padding:18px;
}
.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:15px;
}
.toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.btn{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  font-weight:900;
  cursor:pointer;
}
.primary{background:var(--orange);color:#151515}
.primary:hover{background:var(--orange2)}
.secondary{background:#202025;color:#fff;border:1px solid #34343b}
.notification-list{display:grid;gap:10px}
.notification-item{
  display:grid;
  grid-template-columns:46px minmax(0,1fr) auto;
  gap:13px;
  align-items:start;
  padding:15px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#0d0d10;
  transition:.15s border-color,.15s background;
}
.notification-item.unread{
  border-color:#6a3b1c;
  background:linear-gradient(90deg,rgba(249,115,22,.08),#0d0d10 30%);
}
.notification-dot{
  width:42px;
  height:42px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:#202025;
  border:1px solid #34343b;
  font-size:18px;
}
.notification-item.unread .notification-dot{
  background:#321b0c;
  border-color:#6a3b1c;
}
.notification-title{
  font-weight:950;
  font-size:14px;
  line-height:1.35;
}
.notification-message{
  color:#bbb;
  font-size:13px;
  line-height:1.55;
  margin-top:5px;
  white-space:pre-wrap;
}
.notification-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:7px;
}
.notification-actions{
  display:flex;
  gap:7px;
  align-items:center;
}
.notification-link{
  display:inline-flex;
  margin-top:10px;
  color:#fdba74;
  font-size:12px;
  font-weight:900;
}
.empty{
  padding:34px 18px;
  text-align:center;
  color:var(--muted);
  border:1px dashed #303038;
  border-radius:13px;
}
.unread-pill{
  display:inline-flex;
  min-width:26px;
  height:26px;
  padding:0 8px;
  border-radius:999px;
  align-items:center;
  justify-content:center;
  background:#3a1d0c;
  border:1px solid #6a3b1c;
  color:#fdba74;
  font-size:11px;
  font-weight:950;
}
@media(max-width:650px){
  .shell{padding:22px 14px 55px}
  .top{align-items:flex-start}
  h1{font-size:28px}
  .notification-item{grid-template-columns:42px minmax(0,1fr)}
  .notification-actions{grid-column:2}
}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div>
      <div class="kicker">Espace Membre</div>
      <h1>Notifications</h1>
    </div>
    <a class="back" href="../index.html">← Retour à mon Espace Membre</a>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <b>Centre de notifications</b>
        <span class="unread-pill" id="unreadCount">0</span>
      </div>

      <button class="btn secondary" id="markAllRead" type="button">
        Tout marquer comme lu
      </button>
    </div>

    <div class="muted" style="margin-bottom:15px">
      Tu retrouveras ici les notifications liées à ton compte, à l'entreprise et aux fonctionnalités que nous ajouterons par la suite.
    </div>

    <div class="notification-list" id="notificationList">
      <div class="empty">Chargement...</div>
    </div>
  </div>
</div>

<script src="../../database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=id=>document.getElementById(id);
let db=null;
let user=null;

const typeIcons={
  info:'🔔',
  success:'✅',
  warning:'⚠️',
  sale:'💳',
  company:'🏢',
  money:'💰',
  rank:'⭐',
  inventory:'📦'
};

function formatDate(value){
  if(!value)return '';
  return new Date(value).toLocaleString('fr-FR');
}

async function guard(){
  db=window.supabase.createClient(
    window.VORY_SUPABASE_URL,
    window.VORY_SUPABASE_KEY
  );

  const {data:{session}}=await db.auth.getSession();
  user=session?.user||null;

  if(!user){
    location.href='../index.html';
    return false;
  }

  return true;
}

async function loadNotifications(){
  const box=$('notificationList');
  box.innerHTML='<div class="empty">Chargement...</div>';

  const {data,error}=await db
    .from('notifications')
    .select('*')
    .eq('user_id',user.id)
    .order('created_at',{ascending:false})
    .limit(100);

  if(error){
    box.innerHTML='<div class="empty">Erreur : '+error.message+'</div>';
    return;
  }

  const rows=data||[];
  const unread=rows.filter(n=>!n.is_read).length;
  $('unreadCount').textContent=unread;

  if(!rows.length){
    box.innerHTML='<div class="empty">Aucune notification pour le moment.</div>';
    return;
  }

  box.innerHTML=rows.map(n=>`
    <div class="notification-item ${n.is_read?'':'unread'}" data-id="${n.id}">
      <div class="notification-dot">${typeIcons[n.type]||'🔔'}</div>

      <div>
        <div class="notification-title">${escapeHtml(n.title||'Notification')}</div>
        <div class="notification-message">${escapeHtml(n.message||'')}</div>

        ${n.link
          ? `<a class="notification-link" href="${escapeAttribute(n.link)}">Voir →</a>`
          : ''
        }

        <div class="notification-meta">
          ${formatDate(n.created_at)}
          ${n.is_read?' • Lu':' • Non lu'}
        </div>
      </div>

      <div class="notification-actions">
        ${n.is_read
          ? ''
          : `<button class="btn secondary" type="button" onclick="markRead('${n.id}')">Lu</button>`
        }
      </div>
    </div>
  `).join('');
}

function escapeHtml(value){
  return String(value??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function escapeAttribute(value){
  return escapeHtml(value);
}

async function markRead(id){
  const {error}=await db
    .from('notifications')
    .update({is_read:true})
    .eq('id',id)
    .eq('user_id',user.id);

  if(error){
    alert('Erreur : '+error.message);
    return;
  }

  await loadNotifications();
}

$('markAllRead').onclick=async()=>{
  const {error}=await db
    .from('notifications')
    .update({is_read:true})
    .eq('user_id',user.id)
    .eq('is_read',false);

  if(error){
    alert('Erreur : '+error.message);
    return;
  }

  await loadNotifications();
};

(async()=>{
  if(await guard()){
    await loadNotifications();
  }
})();
</script>
</body>
</html>
