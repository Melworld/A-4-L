<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vory V — Demandes boutique</title>

<style>
:root{
  --bg:#09090b;
  --panel:#111113;
  --panel2:#0d0d10;
  --muted:#8b8b94;
  --line:#25252b;
  --accent:#f97316;
  --accent2:#fb923c;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 8%,rgba(249,115,22,.12),transparent 28%),
    radial-gradient(circle at 90% 90%,rgba(147,51,234,.06),transparent 30%),
    var(--bg);
  color:#fff;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
.page{
  width:min(1220px,calc(100% - 48px));
  margin:0 auto;
  padding:54px 0 100px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:28px;
  margin-bottom:42px;
  padding-bottom:26px;
  border-bottom:1px solid var(--line);
}
.k{
  color:var(--accent);
  font-size:12px;
  font-weight:900;
  letter-spacing:.17em;
  text-transform:uppercase;
  margin-bottom:8px;
}
h1{
  margin:0;
  font-size:clamp(32px,4vw,46px);
  letter-spacing:-.035em;
}
.back{
  color:#c4c4cc;
  text-decoration:none;
  font-size:13px;
  font-weight:850;
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  border-radius:11px;
  padding:11px 15px;
  white-space:nowrap;
}
.back:hover{background:rgba(255,255,255,.06);color:#fff}

.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
  margin-bottom:30px;
}
.stat{
  min-height:112px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));
  border:1px solid var(--line);
  border-radius:17px;
  padding:22px 24px;
}
.stat span{
  color:var(--muted);
  font-size:12px;
  font-weight:750;
  margin-bottom:9px;
}
.stat b{
  font-size:27px;
  line-height:1;
}

.card{
  background:rgba(17,17,19,.94);
  border:1px solid var(--line);
  border-radius:18px;
  padding:26px;
  margin-bottom:26px;
}
.card h2{
  margin:0 0 7px;
  font-size:23px;
  letter-spacing:-.02em;
}
.muted{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}
.orders{
  display:grid;
  gap:15px;
  margin-top:24px;
}
.order{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:15px;
  padding:20px 22px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 170px;
  gap:30px;
  align-items:center;
}
.name{
  font-size:18px;
  font-weight:950;
  margin-bottom:9px;
}
.meta{
  display:flex;
  align-items:center;
  gap:9px 18px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}
.items{
  margin-top:14px;
  padding-top:13px;
  border-top:1px solid rgba(255,255,255,.06);
  color:#dedee3;
  font-size:13px;
  line-height:1.65;
}
.price{
  font-size:22px;
  font-weight:950;
  text-align:right;
  margin-bottom:10px;
}
.btn{
  display:block;
  width:100%;
  border:0;
  border-radius:10px;
  padding:11px 14px;
  background:var(--accent);
  color:#111;
  font-weight:950;
  cursor:pointer;
}
.btn:hover{background:var(--accent2)}
.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  background:#422006;
  color:#fdba74;
}
.done{background:#052e16;color:#86efac}
.empty{
  text-align:center;
  color:var(--muted);
  padding:34px 20px;
  border:1px dashed var(--line);
  border-radius:13px;
  background:rgba(255,255,255,.012);
}
@media(max-width:760px){
  .page{width:min(100% - 28px,1220px);padding-top:30px}
  .top{align-items:flex-start;flex-direction:column;margin-bottom:28px}
  .stats{grid-template-columns:1fr;gap:12px}
  .stat{min-height:92px}
  .card{padding:19px}
  .order{grid-template-columns:1fr;gap:18px;padding:17px}
  .price{text-align:left}
  .btn{width:auto}
}
</style>
</head>
<body><div class="page"><div class="top"><div><div class="k">Vory V — Gestion</div><h1>Demandes boutique</h1></div><a class="back" href="../">← Retour à la gestion</a></div>
<div class="stats"><div class="stat"><span>En attente</span><b id="pc">0</b></div><div class="stat"><span>Validées</span><b id="vc">0</b></div><div class="stat"><span>Total validé</span><b id="vt">0 $</b></div></div>
<div class="card"><h2>Commandes à traiter</h2><div class="muted">Admins et modérateurs peuvent valider.</div><div class="orders" id="pending"></div></div>
<div class="card"><h2>Historique des achats boutique</h2><div class="muted">Le membre du staff ayant validé est conservé.</div><div class="orders" id="history"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../database.js"></script><script>
const db=(window.vorySupabaseConfigured&&window.vorySupabaseConfigured())?window.supabase.createClient(window.VORY_SUPABASE_URL,window.VORY_SUPABASE_KEY):null,$=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('fr-FR')+' $';let user,profile;
const date=v=>v?new Date(v).toLocaleString('fr-FR'):'—',items=v=>Array.isArray(v)?v.map(i=>(i.quantity||1)+'× '+i.name).join(' • '):'';
function node(o,done){let d=document.createElement('div');d.className='order';d.innerHTML=`<div><div class="name">${o.buyer_name||'—'}</div><div class="meta"><span class="badge ${done?'done':''}">${done?'Validée':'En attente'}</span><span>N° RP : ${o.buyer_number||'—'}</span><span>Mail RP : ${o.buyer_email||'—'}</span><span>${date(o.created_at)}</span>${done?`<span>Validée par : ${o.validator_name||'Staff'}</span><span>${date(o.validated_at)}</span>`:''}</div><div class="items">${items(o.items)}</div></div><div><div class="price">${money(o.total)}</div>${done?'':`<button class="btn" data-id="${o.id}">✓ Valider</button>`}</div>`;if(!done)d.querySelector('.btn').onclick=()=>validate(o.id);return d}
async function load(){let {data,error}=await db.from('shop_orders').select('*').order('created_at',{ascending:false});if(error){$('pending').innerHTML='<div class="empty">'+error.message+'</div>';return}let p=data.filter(x=>x.status==='pending'),h=data.filter(x=>x.status==='validated');$('pc').textContent=p.length;$('vc').textContent=h.length;$('vt').textContent=money(h.reduce((s,x)=>s+Number(x.total||0),0));$('pending').innerHTML='';$('history').innerHTML='';p.length?p.forEach(x=>$('pending').append(node(x,false))):$('pending').innerHTML='<div class="empty">Aucune commande en attente.</div>';h.length?h.forEach(x=>$('history').append(node(x,true))):$('history').innerHTML='<div class="empty">Aucun achat validé.</div>'}
async function validate(id){if(!confirm('Valider cette commande ?'))return;let {error}=await db.from('shop_orders').update({status:'validated',validated_at:new Date().toISOString(),validated_by:user.id,validator_name:profile.rp_name||user.email}).eq('id',id);if(error)return alert(error.message);load()}
(async()=>{if(!db)return location.href='../';let {data:{session}}=await db.auth.getSession();user=session?.user;if(!user)return location.href='../';let r=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=r.data;if(r.error||!profile||!['admin','moderator'].includes(profile.role))return location.href='../';load()})();
</script></body></html>
