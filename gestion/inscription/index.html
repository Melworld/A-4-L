<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vory V — Créer un compte</title>
<style>

:root{
  --bg:#09090b;--panel:#111113;--panel2:#151518;--muted:#8b8b94;--line:#25252b;
  --accent:#f97316;--accent2:#fb923c;--danger:#7f1d1d;--ok:#166534;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;
  color:#fff;
  font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at 18% 12%,rgba(249,115,22,.16),transparent 30%),
    radial-gradient(circle at 82% 78%,rgba(249,115,22,.08),transparent 34%),
    radial-gradient(circle at 55% 42%,rgba(255,255,255,.025),transparent 25%),
    linear-gradient(135deg,#070708 0%,#0d0d10 48%,#080809 100%);
  background-attachment:fixed;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:.22;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.75),transparent 90%);
}
button,input,select,textarea{font:inherit}
a{color:inherit}
.hidden{display:none!important}
.page-shell{max-width:1180px;margin:0 auto;padding:34px 24px 80px}
.page-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:52px}
.page-kicker{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.page-top h1{margin:0;font-size:34px;letter-spacing:-.02em}
.back-link{color:#aaa;text-decoration:none;font-weight:800;margin-top:8px}.back-link:hover{color:#fff}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.btn{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{background:var(--accent);color:#111}.btn.primary:hover{background:var(--accent2)}
.btn.secondary{background:#1b1b1f;color:#fff;border:1px solid #303036}
.btn.danger{background:#3a1518;color:#fecaca;border:1px solid #5f2227}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.row{display:grid;gap:7px;margin-bottom:12px}
.row label{font-size:13px;font-weight:800;color:#d4d4d8}
.row input,.row select,.row textarea{width:100%;background:#0c0c0e;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}
.row textarea{min-height:85px;resize:vertical}
.row input:focus,.row select:focus,.row textarea:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.section-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.section-nav a{padding:9px 12px;border:1px solid var(--line);border-radius:9px;color:#aaa;text-decoration:none;font-size:13px;font-weight:800}
.section-nav a:hover{background:#18181b;color:#fff}
.member-panel{display:flex;align-items:center;gap:18px;padding:20px 22px;background:linear-gradient(180deg,#131316,#0f0f12);border:1px solid var(--line);border-radius:18px;margin-bottom:26px}
.member-avatar{width:82px;height:82px;border-radius:50%;overflow:hidden;background:#1b1b20;border:1px solid #33333a;display:grid;place-items:center;font-size:30px;flex:none}
.member-avatar img{width:100%;height:100%;object-fit:cover}
.member-name{font-size:25px;font-weight:950;letter-spacing:-.02em}
.member-role{color:#c7c7ce;font-size:14px;font-weight:800;margin-top:2px}
.member-details{display:flex;gap:10px 20px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:13px}
.member-details b{color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:15px}
.top h2{margin:0}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:#0d0d10;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.stat b{font-size:18px}
@media(max-width:760px){
  .page-shell{padding:24px 14px 60px}.page-top{margin-bottom:36px}.grid,.stat-grid{grid-template-columns:1fr}
  .member-panel{align-items:flex-start}.member-details{display:grid;gap:5px}.page-top h1{font-size:28px}
}

.dashboard-shell{max-width:1120px;margin:0 auto;padding:34px 24px 80px}
.login-wrap{min-height:calc(100vh - 68px);display:grid;place-items:center}
.login{width:min(380px,100%);background:#111113;border:1px solid #2d2d33;border-radius:16px;padding:22px;box-shadow:0 18px 55px rgba(0,0,0,.32)}
.login-title{text-align:center;margin-bottom:18px}.login-title .vory{font-size:30px;font-weight:950;color:var(--accent)}.login-title h2{font-size:16px;margin:7px 0 0;color:#d4d4d8}
.login-error{color:#ef4444;font-size:12px;text-align:center;min-height:18px;margin:8px 0}
.login-home-link{display:block;width:max-content;margin:16px auto 0;color:#8b8b94;text-decoration:none;font-size:13px;font-weight:800}
.dashboard-title{margin-bottom:42px}.dashboard-title .kicker{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.dashboard-title h1{margin:7px 0 0;font-size:36px}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.dashboard-tile{min-height:170px;background:linear-gradient(180deg,#141416,#101012);border:1px solid #29292f;border-radius:16px;padding:19px;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;transition:.15s transform,.15s border-color}
.dashboard-tile:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 28px rgba(249,115,22,.08)}
.dashboard-icon{font-size:28px}.dashboard-tile h3{margin:12px 0 7px;font-size:18px}.dashboard-tile p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.dashboard-arrow{color:var(--accent);font-size:20px;font-weight:900;align-self:flex-end}
.dashboard-head{display:flex;align-items:center;justify-content:space-between;gap:14px}
@media(max-width:850px){.dashboard-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.dashboard-grid{grid-template-columns:1fr}}

.signup-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.signup-card{width:min(420px,100%);background:#111113;border:1px solid #2d2d33;border-radius:16px;padding:24px;box-shadow:0 18px 55px rgba(0,0,0,.32)}
.signup-title{text-align:center;margin-bottom:22px}.signup-title .vory{font-size:30px;font-weight:950;color:var(--accent)}.signup-title h2{font-size:17px;margin:7px 0 0;color:#d4d4d8}
.signup-msg{min-height:18px;text-align:center;font-size:12px;margin:10px 0}
.signup-msg.error{color:#ef4444}.signup-msg.ok{color:#22c55e}
.signup-links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.signup-links a{color:#8b8b94;text-decoration:none;font-size:13px;font-weight:800}.signup-links a:hover{color:#fff}
</style>
</head>
<body>
<div class="signup-wrap">
  <div class="signup-card">
    <div class="signup-title">
      <div class="vory">Vory V</div>
      <h2>Créer un compte</h2>
    </div>

    <div class="row">
      <label>Nom RP</label>
      <input id="rpName" maxlength="60" placeholder="Ex. Jean Pascal">
    </div>

    <div class="row">
      <label>Numéro RP</label>
      <input id="rpPhone" maxlength="14" placeholder="00-00-00-00-00">
    </div>

    <div class="row">
      <label>Je souhaite</label>
      <select id="joinRequest">
        <option value="">Choisir...</option>
        <option value="Base">Créer simplement mon compte</option>
        <option value="entreprise">Rejoindre l'entreprise</option>
        <option value="gang">Rejoindre le gang</option>
        <option value="Autre">Autre...</option>
      </select>
    </div>

    <div class="row">
      <label>Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="email@a4l.fr">
    </div>

    <div class="row">
      <label>Mot de passe</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="8 caractères minimum">
    </div>

    <div class="row">
      <label>Confirmer le mot de passe</label>
      <input id="password2" type="password" autocomplete="new-password">
    </div>

    <div id="signupMsg" class="signup-msg"></div>

    <div class="actions" style="justify-content:center">
      <button class="btn primary" id="signupBtn">Créer mon compte</button>
    </div>

    <div class="signup-links">
      <a href="../">J'ai déjà un compte</a>
      <a href="../../index.html">← Site principal</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../database.js"></script>
<script>
const $=id=>document.getElementById(id);
let db=null;
if(window.vorySupabaseConfigured&&window.vorySupabaseConfigured()){
  db=window.supabase.createClient(window.VORY_SUPABASE_URL,window.VORY_SUPABASE_KEY);
}

function showMsg(text,type='error'){
  const el=$('signupMsg');
  el.textContent=text;
  el.className='signup-msg '+type;
}


$('rpPhone').addEventListener('input',()=>{
  const digits=$('rpPhone').value.replace(/\D/g,'').slice(0,10);
  $('rpPhone').value=digits.match(/.{1,2}/g)?.join('-')||'';
});

async function signup(){
  if(!db){showMsg('La base de données n’est pas configurée.');return;}

  const rpName=$('rpName').value.trim();
  const rpPhone=$('rpPhone').value.trim();
  const joinRequest=$('joinRequest').value;
  const email=$('email').value.trim().toLowerCase();
  const password=$('password').value;
  const password2=$('password2').value;

  if(rpName.length<3){showMsg('Entre un Nom RP valide.');return;}
  if(!/^\d{2}-\d{2}-\d{2}-\d{2}-\d{2}$/.test(rpPhone)){showMsg('Le numéro RP doit être au format 00-00-00-00-00.');return;}
  if(!['Base','entreprise','gang','Autre'].includes(joinRequest)){
    showMsg('Choisis ce que tu souhaites faire avec ton compte.');
    return;
  }
  if(!email.includes('@')){showMsg('Entre une adresse email valide.');return;}
  if(password.length<8){showMsg('Le mot de passe doit contenir au moins 8 caractères.');return;}
  if(password!==password2){showMsg('Les deux mots de passe ne correspondent pas.');return;}

  $('signupBtn').disabled=true;
  showMsg('Création du compte...','');

  const {data,error}=await db.auth.signUp({
    email,
    password,
    options:{
      data:{
        rp_name:rpName,
        rp_phone:rpPhone,
        join_request:joinRequest
      }
    }
  });

  $('signupBtn').disabled=false;

  if(error){
    if((error.message||'').toLowerCase().includes('registered')) showMsg('Cette adresse email possède déjà un compte.');
    else showMsg('Impossible de créer le compte : '+error.message);
    return;
  }

  if(data?.session){
    showMsg('Compte créé ! Redirection vers ton espace...','ok');
    setTimeout(()=>location.href='../',1100);
  }else{
    showMsg('Compte créé. Vérifie ton email pour confirmer ton inscription, puis connecte-toi.','ok');
  }
}

$('signupBtn').onclick=signup;
$('password2').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();signup();}
});
</script>
</body>
</html>
